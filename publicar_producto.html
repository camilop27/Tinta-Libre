  <main class="form-publicar">
    <h2>Publicar un producto</h2>
    <p>Comparte tus creaciones con la comunidad y apoya el arte local.</p>

    <form id="formPublicarProducto" class="formulario">
      <label for="nombreProducto">Nombre del producto:</label>
      <input type="text" id="nombreProducto" placeholder="Ejemplo: Lienzo urbano" required>

      <label for="descripcionProducto">Descripción:</label>
      <textarea id="descripcionProducto" placeholder="Describe brevemente tu producto..." required></textarea>

      <label for="precioProducto">Precio (COP):</label>
      <input type="number" id="precioProducto" placeholder="Ejemplo: 20000 - Colocar sin puntos" min="0" required>

      <label for="imagenProducto">Imagen del producto:</label>
      <input type="file" id="imagenProducto" accept="image/*" required>

      <img id="previewProducto" alt="Vista previa" style="display:none; width:100%; border-radius:10px; margin-top:10px;">

      <button type="submit" class="btn-publicar">Publicar producto</button>
    </form>
  </main>
