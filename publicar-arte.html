  <main class="form-publicar">
	 
    <h2>Publicar tu arte</h2>
    <p>Sube tu graffiti o ilustración para compartirla en la galería.</p>

    <form id="formPublicarArte" style="max-width:500px;margin:30px auto;text-align:left;">
      <label>Título de la obra:</label>
      <input type="text" id="tituloArte" required style="width:100%;padding:8px;margin:8px 0;">

      <label>Descripción:</label>
      <textarea id="descripcionArte" required rows="3" style="width:100%;padding:8px;margin:8px 0;"></textarea>

      <label>Imagen:</label>
      <input type="file" id="imagenArte" accept="image/*" required style="margin:8px 0;">
      <img alt="" id="previewArte" style="display:none;width:100%;margin-top:10px;border-radius:10px;">

      <button type="submit" class="btn-publicar" style="margin-top:15px;">Publicar</button>
    </form>
  </main>
